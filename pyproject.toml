[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "coupled-wm"
version = "0.1.0"
description = "Coupled local and global world models for efficient first-order RL (CoRL 2026)"
readme = "README.md"
authors = [{ name = "the authors of 'Coupled Local and Global World Models for Efficient First Order RL'" }]
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = [
    "torch>=2.5",
    "torchvision",
    "numpy>=1.24",
    "h5py>=3.8",
    "pyyaml>=6.0",
    "tensorboard>=2.12",
    "safetensors>=0.4",
    "huggingface_hub>=0.34",
    "lpips>=0.1.4",
    "pillow",
]

[project.optional-dependencies]
wandb = ["wandb>=0.16"]
video = ["imageio-ffmpeg>=0.4"]
test = ["pytest>=7"]

[tool.setuptools.packages.find]
include = ["coupled_wm*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
norecursedirs = ["gpu", ".*", "*.egg-info", "build", "dist", "__pycache__"]
addopts = "-ra"
